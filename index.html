<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dharashiv Connect – Issue & Resolution Form</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #1d4ed8;
      --primary-dark: #1e40af;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }
    .container { max-width: 820px; margin: 0 auto; }
    header {
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: #fff;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    header h1 { font-size: 1.35rem; margin-bottom: 4px; }
    header p { font-size: 0.9rem; opacity: 0.9; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(15,23,42,0.04);
    }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.92rem; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    input[type="text"], input[type="tel"], select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
    }
    textarea { min-height: 100px; resize: vertical; }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
    }
    .opt-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      background: #f8fafc;
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      width: 100%;
    }
    .btn:hover { background: var(--primary-dark); }
    .ticket-box {
      display: none;
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #14532d;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
    }
    .attach-preview img { max-width: 220px; max-height: 160px; border-radius: 8px; border: 1px solid var(--border); display: block; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Dharashiv Connect – Issue & Resolution Form</h1>
      <p>समस्या, बग, बदलाव या डॉक्यूमेंट/स्क्रीनशॉट अपलोड करें</p>
    </header>

    <section class="card">
      <h2 style="margin-bottom: 14px; font-size: 1.15rem;">समस्या / बदलाव दर्ज करें</h2>
      <form id="issueForm">
        <div class="grid-2">
          <div class="field">
            <label for="userName">1. पूरा नाम (Full Name) *</label>
            <input type="text" id="userName" required placeholder="अपना नाम लिखें" />
          </div>
          <div class="field">
            <label for="userPhone">2. मोबाइल / WhatsApp नंबर *</label>
            <input type="tel" id="userPhone" required pattern="[0-9+\-\s]{10,15}" placeholder="उदा. 98XXXXXXXX" />
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="userRole">3. यूजर रोल *</label>
            <select id="userRole" required>
              <option value="">-- चुनें --</option>
              <option value="Citizen / Customer">नागरिक / ग्राहक (Citizen)</option>
              <option value="Business / Merchant">बिज़नेस / दुकानदार / सर्विस प्रोवाइडर (Merchant)</option>
              <option value="Other">अन्य (Other)</option>
            </select>
          </div>
          <div class="field">
            <label for="severity">4. समस्या की गंभीरता (Priority) *</label>
            <select id="severity" required>
              <option value="High">🔴 High – ऐप / काम रुका है</option>
              <option value="Medium" selected>🟡 Medium – दिक्कत आ रही है</option>
              <option value="Low">🟢 Low – सुझाव / छोटा बदलाव</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>5. समस्या या बदलाव की श्रेणी (एक से अधिक चुन सकते हैं) *</label>
          <div class="options-grid" id="categoryGroup">
            <label class="opt-item"><input type="checkbox" value="Login / OTP / Registration Issue" /> लॉगिन / OTP / रजिस्ट्रेशन</label>
            <label class="opt-item"><input type="checkbox" value="Dashboard / Profile Issue" /> डैशबोर्ड / प्रोफाइल</label>
            <label class="opt-item"><input type="checkbox" value="Business Listing / Search Issue" /> लिस्टिंग / कैटेगरी / सर्च</label>
            <label class="opt-item"><input type="checkbox" value="Booking / Order / Payment Issue" /> बुकिंग / ऑर्डर / पेमेंट</label>
            <label class="opt-item"><input type="checkbox" value="App Crash / Slow / UI Bug" /> क्रैश / स्लो / स्क्रीन लोड</label>
            <label class="opt-item"><input type="checkbox" value="New Feature / Development" /> नया फीचर / डेवलपमेंट</label>
            <label class="opt-item"><input type="checkbox" value="Existing Feature Changes" /> मौजूदा फीचर में बदलाव</label>
            <label class="opt-item"><input type="checkbox" value="Other / Remarks" /> अन्य / रिमार्क्स</label>
          </div>
        </div>

        <div class="field">
          <label for="screenName">6. ऐप का स्क्रीन / पेज / सेक्शन</label>
          <input type="text" id="screenName" placeholder="उदा. Login Screen, Merchant Dashboard, Category Page, Payment Screen" />
        </div>

        <div class="field">
          <label for="description">7. समस्या या बदलाव का विस्तृत विवरण *</label>
          <textarea id="description" required placeholder="नेमकी क्या समस्या आ रही है या आपको क्या बदलाव चाहिए, विस्तार से लिखें..."></textarea>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="docUpload">8. डॉक्यूमेंट / स्क्रीनशॉट / फाइल अपलोड करें</label>
            <input type="file" id="docUpload" accept="image/*,.pdf,.doc,.docx,.txt,.csv,.xlsx" />
            <div class="hint">स्क्रीनशॉट, PDF या डॉक्यूमेंट अटैच करें (~2MB से छोटी फाइल बेहतर रहेगी)।</div>
            <div id="filePreview" class="attach-preview"></div>
          </div>
          <div class="field">
            <label for="deviceInfo">9. डिवाइस मॉडल और Android वर्जन</label>
            <input type="text" id="deviceInfo" placeholder="उदा. Redmi Note 10 Pro, Android 13" />
            <div class="field" style="margin-top: 10px; margin-bottom: 0;">
              <label for="remarks">10. अतिरिक्त रिमार्क्स</label>
              <input type="text" id="remarks" placeholder="कोई अतिरिक्त टिप्पणी हो तो लिखें" />
            </div>
          </div>
        </div>

        <button type="submit" class="btn">Submit Issue</button>
      </form>

      <div id="ticketBox" class="ticket-box"></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "dc_issues_v1";
    let currentAttachment = null;

    function getIssues() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveIssues(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    document.getElementById("docUpload").addEventListener("change", function (e) {
      const file = e.target.files[0];
      const preview = document.getElementById("filePreview");
      preview.innerHTML = "";
      currentAttachment = null;
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (ev) {
        currentAttachment = {
          name: file.name,
          type: file.type,
          sizeKB: Math.round(file.size / 1024),
          dataUrl: ev.target.result
        };
        if (file.type.startsWith("image/")) {
          preview.innerHTML = `<span class="hint">Attached: ${escapeHtml(file.name)} (${currentAttachment.sizeKB} KB)</span><img src="${ev.target.result}" alt="Preview" />`;
        } else {
          preview.innerHTML = `<span class="hint">Attached Document: ${escapeHtml(file.name)} (${currentAttachment.sizeKB} KB)</span>`;
        }
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("issueForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const selectedCats = Array.from(document.querySelectorAll("#categoryGroup input:checked")).map(el => el.value);
      if (selectedCats.length === 0) {
        alert("कृपया कम से कम एक श्रेणी (Category) चुनें।");
        return;
      }

      const issues = getIssues();
      const nextNum = 101 + issues.length;
      const ticket = {
        id: "DC-" + nextNum,
        createdAt: new Date().toLocaleString("en-IN"),
        name: document.getElementById("userName").value.trim(),
        phone: document.getElementById("userPhone").value.trim(),
        role: document.getElementById("userRole").value,
        severity: document.getElementById("severity").value,
        categories: selectedCats,
        screen: document.getElementById("screenName").value.trim(),
        description: document.getElementById("description").value.trim(),
        device: document.getElementById("deviceInfo").value.trim(),
        remarks: document.getElementById("remarks").value.trim(),
        attachment: currentAttachment,
        status: "Open",
        resolution: ""
      };

      issues.unshift(ticket);
      saveIssues(issues);

      const box = document.getElementById("ticketBox");
      box.style.display = "block";
      box.innerHTML = `
        <strong>समस्या सफलतापूर्वक दर्ज हो गई!</strong><br/>
        Ticket ID: <strong>#${escapeHtml(ticket.id)}</strong> | Status: <strong>Open</strong><br/>
        आपकी रिपोर्ट और अटैचमेंट सेव कर ली गई है। जल्द ही समाधान किया जाएगा।
      `;

      e.target.reset();
      document.getElementById("filePreview").innerHTML = "";
      currentAttachment = null;
    });

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }
  </script>
</body>
</html>
