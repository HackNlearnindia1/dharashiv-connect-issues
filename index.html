<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dharashiv Connect – Issue & Resolution Form</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #1d4ed8;
      --primary-dark: #1e40af;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }
    .container { max-width: 840px; margin: 0 auto; }
    header {
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: #fff;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.3rem; margin-bottom: 4px; }
    header p { font-size: 0.88rem; opacity: 0.92; }
    .lang-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.14);
      padding: 6px 10px;
      border-radius: 10px;
    }
    .lang-bar select {
      width: auto;
      padding: 6px 10px;
      border-radius: 7px;
      border: none;
      font-weight: 600;
      font-size: 0.88rem;
      background: #ffffff;
      color: #0f172a;
      cursor: pointer;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(15,23,42,0.04);
    }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .field { margin-bottom: 14px; }
    label.field-label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.92rem; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    input[type="text"], input[type="tel"], select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
    }
    textarea { min-height: 100px; resize: vertical; }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
    }
    .opt-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      background: #f8fafc;
      cursor: pointer;
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      width: 100%;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .ticket-box {
      display: none;
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #14532d;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
    }
    .attach-preview img { max-width: 220px; max-height: 160px; border-radius: 8px; border: 1px solid var(--border); display: block; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 id="t_title">Dharashiv Connect – Issue & Resolution Form</h1>
        <p id="t_subtitle">समस्या, बग, बदल किंवा डॉक्युमेंट/स्क्रीनशॉट अपलोड करा</p>
      </div>
      <div class="lang-bar">
        <span id="t_lang_label" style="font-size:0.84rem; font-weight:600;">भाषा:</span>
        <select id="langSelect" onchange="applyLanguage(this.value)">
          <option value="mr" selected>मराठी (Marathi)</option>
          <option value="hi">हिन्दी (Hindi)</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>

    <section class="card">
      <h2 id="t_form_heading" style="margin-bottom: 14px; font-size: 1.15rem;">समस्या / बदल नोंदवा</h2>
      <form id="issueForm">
        <div class="grid-2">
          <div class="field">
            <label class="field-label" id="t_l_name" for="userName">1. पूर्ण नाव *</label>
            <input type="text" id="userName" required />
          </div>
          <div class="field">
            <label class="field-label" id="t_l_phone" for="userPhone">2. मोबाईल / WhatsApp नंबर *</label>
            <input type="tel" id="userPhone" required pattern="[0-9+\-\s]{10,15}" />
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label class="field-label" id="t_l_role" for="userRole">3. युजर प्रकार *</label>
            <select id="userRole" required></select>
          </div>
          <div class="field">
            <label class="field-label" id="t_l_sev" for="severity">4. समस्येची तीव्रता *</label>
            <select id="severity" required></select>
          </div>
        </div>

        <div class="field">
          <label class="field-label" id="t_l_cat">5. समस्या किंवा बदलाचा प्रकार (एक किंवा अधिक निवडा) *</label>
          <div class="options-grid" id="categoryGroup"></div>
        </div>

        <div class="field">
          <label class="field-label" id="t_l_screen" for="screenName">6. अॅपमधील स्क्रीन / पेज / विभाग</label>
          <input type="text" id="screenName" />
        </div>

        <div class="field">
          <label class="field-label" id="t_l_desc" for="description">7. समस्या किंवा बदलाचा सविस्तर तपशील *</label>
          <textarea id="description" required></textarea>
        </div>

        <div class="grid-2">
          <div class="field">
            <label class="field-label" id="t_l_doc" for="docUpload">8. डॉक्युमेंट / स्क्रीनशॉट / फाइल अपलोड करा</label>
            <input type="file" id="docUpload" accept="image/*,.pdf,.doc,.docx,.txt,.csv,.xlsx" />
            <div class="hint" id="t_h_doc">स्क्रीनशॉट, PDF किंवा डॉक्युमेंट जोडा (~500KB पेक्षा लहान फाइल शीटसाठी उत्तम).</div>
            <div id="filePreview" class="attach-preview"></div>
          </div>
          <div class="field">
            <label class="field-label" id="t_l_dev" for="deviceInfo">9. डिव्हाइस मॉडेल आणि Android व्हर्जन</label>
            <input type="text" id="deviceInfo" />
            <div class="field" style="margin-top: 10px; margin-bottom: 0;">
              <label class="field-label" id="t_l_rem" for="remarks">10. अतिरिक्त रिमार्क्स</label>
              <input type="text" id="remarks" />
            </div>
          </div>
        </div>

        <button type="submit" class="btn" id="t_btn_submit">समस्या नोंदवा (Submit)</button>
      </form>

      <div id="ticketBox" class="ticket-box"></div>
    </section>
  </div>

    let currentLang = "mr";
    let currentAttachment = null;

    function applyLanguage(lang) {
      currentLang = I18N[lang] ? lang : "mr";
      document.documentElement.lang = currentLang;
      const t = I18N[currentLang];

      document.getElementById("t_title").textContent = t.title;
      document.getElementById("t_subtitle").textContent = t.subtitle;
      document.getElementById("t_lang_label").textContent = t.langLabel;
      document.getElementById("t_form_heading").textContent = t.heading;

      document.getElementById("t_l_name").textContent = t.lName;
      document.getElementById("userName").placeholder = t.pName;

      document.getElementById("t_l_phone").textContent = t.lPhone;
      document.getElementById("userPhone").placeholder = t.pPhone;

      const roleSel = document.getElementById("userRole");
      const prevRole = roleSel.value;
      roleSel.innerHTML = t.roles.map(r => `<option value="${escapeAttr(r.val)}">${escapeHtml(r.label)}</option>`).join("");
      roleSel.value = prevRole;
      document.getElementById("t_l_role").textContent = t.lRole;

      const sevSel = document.getElementById("severity");
      const prevSev = sevSel.value || "Medium";
      sevSel.innerHTML = t.sevs.map(s => `<option value="${escapeAttr(s.val)}">${escapeHtml(s.label)}</option>`).join("");
      sevSel.value = prevSev;
      document.getElementById("t_l_sev").textContent = t.lSev;

      const checkedVals = Array.from(document.querySelectorAll("#categoryGroup input:checked")).map(el => el.value);
      document.getElementById("t_l_cat").textContent = t.lCat;
      document.getElementById("categoryGroup").innerHTML = t.cats.map(c => `
        <label class="opt-item">
          <input type="checkbox" value="${escapeAttr(c.val)}" ${checkedVals.includes(c.val) ? "checked" : ""} />
          <span>${escapeHtml(c.label)}</span>
        </label>
      `).join("");

      document.getElementById("t_l_screen").textContent = t.lScreen;
      document.getElementById("screenName").placeholder = t.pScreen;

      document.getElementById("t_l_desc").textContent = t.lDesc;
      document.getElementById("description").placeholder = t.pDesc;

      document.getElementById("t_l_doc").textContent = t.lDoc;
      document.getElementById("t_h_doc").textContent = t.hDoc;

      document.getElementById("t_l_dev").textContent = t.lDev;
      document.getElementById("deviceInfo").placeholder = t.pDev;

      document.getElementById("t_l_rem").textContent = t.lRem;
      document.getElementById("remarks").placeholder = t.pRem;

      document.getElementById("t_btn_submit").textContent = t.submit;
      renderAttachmentPreview();
    }

    function renderAttachmentPreview() {
      const preview = document.getElementById("filePreview");
      preview.innerHTML = "";
      if (!currentAttachment) return;
      const t = I18N[currentLang];
      if (currentAttachment.type && currentAttachment.type.startsWith("image/")) {
        const msg = t.attImg.replace("{name}", escapeHtml(currentAttachment.name)).replace("{size}", currentAttachment.sizeKB);
        preview.innerHTML = `<span class="hint">${msg}</span><img src="${currentAttachment.dataUrl}" alt="Preview" />`;
      } else {
        const msg = t.attDoc.replace("{name}", escapeHtml(currentAttachment.name)).replace("{size}", currentAttachment.sizeKB);
        preview.innerHTML = `<span class="hint">${msg}</span>`;
      }
    }

    document.getElementById("docUpload").addEventListener("change", function (e) {
      const file = e.target.files[0];
      currentAttachment = null;
      if (!file) {
        renderAttachmentPreview();
        return;
      }
      const reader = new FileReader();
      reader.onload = function (ev) {
        currentAttachment = {
          name: file.name,
          type: file.type,
          sizeKB: Math.round(file.size / 1024),
          dataUrl: ev.target.result
        };
        renderAttachmentPreview();
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("issueForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const t = I18N[currentLang];
      const selectedCats = Array.from(document.querySelectorAll("#categoryGroup input:checked")).map(el => el.value);
      if (selectedCats.length === 0) {
        alert(t.alertCat);
        return;
      }

      const btn = document.getElementById("t_btn_submit");
      btn.disabled = true;
      btn.textContent = t.submitting;

      const payload = {
        action: "create",
        language: currentLang,
        name: document.getElementById("userName").value.trim(),
        phone: document.getElementById("userPhone").value.trim(),
        role: document.getElementById("userRole").value,
        severity: document.getElementById("severity").value,
        categories: selectedCats,
        screen: document.getElementById("screenName").value.trim(),
        description: document.getElementById("description").value.trim(),
        device: document.getElementById("deviceInfo").value.trim(),
        remarks: document.getElementById("remarks").value.trim(),
        attachment: currentAttachment
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const rawText = await res.text();
        let data = {};
        try {
          data = JSON.parse(rawText);
        } catch (parseErr) {
          throw new Error("HTTP " + res.status + " | Non-JSON response: " + rawText.slice(0, 200));
        }

        if (!res.ok || data.status !== "ok") {
          throw new Error("HTTP " + res.status + " | " + (data.message || rawText.slice(0, 200)));
        }

        const ticketId = data.id || "DC-NEW";

        const box = document.getElementById("ticketBox");
        box.style.display = "block";
        box.innerHTML = `
          <strong>${escapeHtml(t.successTitle)}</strong><br/>
          ${t.ticketLine.replace("{id}", escapeHtml(ticketId))}<br/>
          ${escapeHtml(t.successNote)}
        `;

        e.target.reset();
        currentAttachment = null;
        renderAttachmentPreview();
        applyLanguage(currentLang);
      } catch (err) {
        alert("Error Code / Details: " + (err && err.message ? err.message : String(err)));
      } finally {
        btn.disabled = false;
        btn.textContent = t.submit;
      }
    });

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }
    function escapeAttr(str) {
      return escapeHtml(str);
    }

    applyLanguage("mr");
  </script>
</body>
</html>
